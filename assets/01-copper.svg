<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="A copper line draws across a dark plate, then RULES, SKILLS and LANGUAGES lock in">
  <rect width="720" height="220" fill="#141210"/>
  <g stroke="#3a342e" stroke-width="1">
    <line x1="0" y1="36" x2="720" y2="36"/>
    <line x1="0" y1="108" x2="720" y2="108"/>
    <line x1="0" y1="168" x2="720" y2="168"/>
  </g>
  <line x1="64" y1="72" x2="656" y2="72" stroke="#e07a3d" stroke-width="3">
    <animate attributeName="x2" values="64;656;656" keyTimes="0;0.28;1" dur="5s" repeatCount="indefinite"/>
  </line>
  <g fill="#f4ecdf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="600" letter-spacing="6">
    <text x="64" y="100" opacity="1">AI SETUP
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.12;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">
    <text x="64" y="148" fill="#e07a3d" opacity="1">RULES
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.46;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="280" y="148" fill="#e07a3d" opacity="1">SKILLS
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.58;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="496" y="148" fill="#e07a3d" opacity="1">LANGUAGES
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.7;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="196" fill="#8fa37a" font-size="11" opacity="1">PINNED
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.82;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="280" y="196" fill="#8fa37a" font-size="11" opacity="1">PINNED
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.88;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="496" y="196" fill="#8fa37a" font-size="11" opacity="1">PINNED
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.94;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
