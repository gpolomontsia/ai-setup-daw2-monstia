<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="A terminal session where an agent pins rules, skills and languages">
  <rect width="720" height="220" fill="#0e1410"/>
  <rect x="36" y="20" width="648" height="180" rx="8" fill="#101814" stroke="#2a4034"/>
  <circle cx="58" cy="40" r="5" fill="#c45c4a"/>
  <circle cx="76" cy="40" r="5" fill="#d4a054"/>
  <circle cx="94" cy="40" r="5" fill="#7d9a62"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="56" y="78" fill="#7d9a62" opacity="1">$ agent read AGENTS.md
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="108" fill="#d7e6cf" opacity="1">rules ........ pinned
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.32;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="136" fill="#d7e6cf" opacity="1">skills ....... pinned
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="164" fill="#d7e6cf" opacity="1">languages .... en, ca
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.68;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="164" fill="#7d9a62" opacity="1">_
      <animate attributeName="opacity" values="0;0;1;0;1" keyTimes="0;0.68;0.74;0.88;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
