<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Two lanes, English and Catalan, filling in side by side">
  <rect width="720" height="220" fill="#12161c"/>
  <line x1="360" y1="28" x2="360" y2="192" stroke="#2a3340" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="58" fill="#8aa0b8" font-size="12" letter-spacing="3" opacity="1">ENGLISH
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.12;1" dur="5.4s" repeatCount="indefinite"/>
    </text>
    <text x="392" y="58" fill="#8aa0b8" font-size="12" letter-spacing="3" opacity="1">CATALÀ
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.12;1" dur="5.4s" repeatCount="indefinite"/>
    </text>
    <rect x="56" y="84" width="248" height="10" fill="#3d7ea6" opacity="1">
      <animate attributeName="width" values="0;248;248" keyTimes="0;0.4;1" dur="5.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="392" y="84" width="248" height="10" fill="#c46b4a" opacity="1">
      <animate attributeName="width" values="0;248;248" keyTimes="0;0.4;1" dur="5.4s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="132" fill="#e8eef4" font-size="16" opacity="1">same file
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.6;1" dur="5.4s" repeatCount="indefinite"/>
    </text>
    <text x="392" y="132" fill="#e8eef4" font-size="16" opacity="1">el mateix fitxer
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.6;1" dur="5.4s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="168" fill="#e8eef4" font-size="16" opacity="1">two languages
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.78;1" dur="5.4s" repeatCount="indefinite"/>
    </text>
    <text x="392" y="168" fill="#e8eef4" font-size="16" opacity="1">dues llengües
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.78;1" dur="5.4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
